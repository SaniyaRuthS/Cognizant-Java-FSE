<div class="container form-container">
  <h2>Reactive Student Enrollment Form</h2>

  <form [formGroup]="enrollForm" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="studentName">Student Name *</label>
      <input id="studentName" formControlName="studentName" class="form-control" />
      <span *ngIf="enrollForm.get('studentName')?.touched && enrollForm.get('studentName')?.errors?.['required']" class="error-text">Name is required</span>
      <span *ngIf="enrollForm.get('studentName')?.touched && enrollForm.get('studentName')?.errors?.['minlength']" class="error-text">Name must be at least 3 characters</span>
    </div>

    <div class="form-group">
      <label for="studentEmail">Student Email *</label>
      <input id="studentEmail" formControlName="studentEmail" class="form-control" />
      <span *ngIf="enrollForm.get('studentEmail')?.touched && enrollForm.get('studentEmail')?.errors?.['required']" class="error-text">Email is required</span>
      <span *ngIf="enrollForm.get('studentEmail')?.touched && enrollForm.get('studentEmail')?.errors?.['email']" class="error-text">Invalid email format</span>
      <span *ngIf="enrollForm.get('studentEmail')?.errors?.['emailTaken']" class="error-text">Email taken</span>
    </div>

    <div class="form-group">
      <label for="courseId">Course ID / Code *</label>
      <input id="courseId" formControlName="courseId" class="form-control" />
      <span *ngIf="enrollForm.get('courseId')?.touched && enrollForm.get('courseId')?.errors?.['required']" class="error-text">Course ID is required</span>
      <span *ngIf="enrollForm.get('courseId')?.errors?.['noCourseCode']" class="error-text">Course code starting with XX is not allowed.</span>
    </div>

    <div class="form-group">
      <label for="preferredSemester">Preferred Semester</label>
      <select id="preferredSemester" formControlName="preferredSemester" class="form-control">
        <option value="Odd">Odd</option>
        <option value="Even">Even</option>
      </select>
    </div>

    <div class="form-group checkbox-group">
      <label>
        <input type="checkbox" formControlName="agreeToTerms" />
        I agree to the enrollment terms and conditions *
      </label>
      <span *ngIf="enrollForm.get('agreeToTerms')?.touched && enrollForm.get('agreeToTerms')?.errors?.['required']" class="error-text">You must agree to terms</span>
    </div>

    <div class="form-group">
      <h3>Additional Courses</h3>
      <div *ngFor="let ctrl of additionalCourses.controls; let i = index" class="dynamic-row">
        <input [formControl]="$any(ctrl)" placeholder="Course Code" class="form-control inline-input" />
        <button type="button" (click)="removeCourse(i)" class="btn btn-remove">Remove</button>
      </div>
      <button type="button" (click)="addCourse()" class="btn btn-add">Add Another Course</button>
    </div>

    <div class="button-group">
      <button type="submit" [disabled]="enrollForm.invalid" class="btn btn-submit">Submit</button>
    </div>
  </form>

  <div *ngIf="submitted" class="success-banner">
    Reactive enrollment form submitted successfully!
  </div>
</div>
